name: release

# Push a tag like `v1.0` (or run this manually) to build the ROM, generate the
# IPS patch, and publish a GitHub Release with the patch attached.
#
# Only the .ips patch is uploaded -- never the assembled ROM -- so no copyrighted
# game data is distributed.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deepen history for base ROM reconstruction
        # `make ips` rebuilds the original ROM from an earlier commit (base_ref)
        # in a git worktree, so that commit must be present. Fetch just enough
        # history rather than the whole repo.
        run: git fetch --shallow-since=2026-01-29 origin

      - name: Install rgbds
        # Use the official prebuilt binary instead of building from source.
        run: |
          mkdir -p "$HOME/rgbds"
          curl -fsSL https://github.com/gbdev/rgbds/releases/download/v1.0.0/rgbds-linux-x86_64.tar.xz \
            | tar -xJ -C "$HOME/rgbds"
          echo "$HOME/rgbds" >> "$GITHUB_PATH"
          # rgbgfx links libpng at runtime; install it in case the runner lacks it.
          sudo apt-get update && sudo apt-get install -yq libpng16-16

      - name: Build patch
        run: make -j$(nproc) ips

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and upload patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            warioland3-debug-menu.ips \
            --title "${{ steps.tag.outputs.name }}" \
            --notes "Apply \`warioland3-debug-menu.ips\` to a Wario Land 3 (USA/Europe) ROM whose SHA1 is \`bb7877309834441fd03adb7fa65738e5d5b2d7ba\`, using any IPS patcher (e.g. Floating IPS / flips, or rompatcher.js)."
