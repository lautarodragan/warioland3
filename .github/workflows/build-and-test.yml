name: build-and-test

# Changes to the book alone don't touch the ROM or the tests (book.yml
# builds the book).
on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'book/**'
      - '.github/workflows/book.yml'
  pull_request:
    paths-ignore:
      - 'book/**'
      - '.github/workflows/book.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rgbds
        # Use the official prebuilt binary instead of building from source.
        run: |
          mkdir -p "$HOME/rgbds"
          curl -fsSL https://github.com/gbdev/rgbds/releases/download/v1.0.0/rgbds-linux-x86_64.tar.xz \
            | tar -xJ -C "$HOME/rgbds"
          echo "$HOME/rgbds" >> "$GITHUB_PATH"
          # rgbgfx links libpng at runtime; install it in case the runner lacks it.
          sudo apt-get update && sudo apt-get install -yq libpng16-16

      - name: Build
        run: |
          make DEBUG=1 -j$(nproc)
          if ! git diff-index --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff-index HEAD --
            exit 1
          fi

      - name: Check the book's names
        # a rename in the code can leave the book naming something that's gone
        run: python3 tools/check_book_names.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Test
        run: make test

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: tests/output/
